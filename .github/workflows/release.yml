name: Release

on:
    push:
        branches: [main]

concurrency: ${{ github.workflow }}-${{ github.ref }}

# Writes go through the release app's token: unlike GITHUB_TOKEN, its pushes and PRs trigger CI and this workflow
permissions:
    contents: read

jobs:
    release:
        name: Version and release
        runs-on: ubuntu-latest
        steps:
            - name: Create release app token
              id: app-token
              uses: actions/create-github-app-token@v3
              with:
                  client-id: ${{ vars.RELEASE_APP_CLIENT_ID }}
                  private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
                  permission-contents: write
                  permission-pull-requests: write

            - name: Checkout
              uses: actions/checkout@v4
              with:
                  fetch-depth: 0
                  token: ${{ steps.app-token.outputs.token }}

            - name: Setup pnpm
              uses: pnpm/action-setup@v4

            - name: Setup Node
              uses: actions/setup-node@v4
              with:
                  node-version: 24
                  cache: pnpm

            - name: Install dependencies
              run: pnpm install --frozen-lockfile

            # With pending changesets it opens the version PR; once that PR is merged it tags vX.Y.Z and
            # creates the GitHub release from the CHANGELOG entry
            - name: Create version PR or release
              id: changesets
              uses: changesets/action@v1
              with:
                  version: pnpm run version
                  publish: pnpm changeset tag
                  commit: 'chore: version packages'
                  title: 'chore: version packages'
              env:
                  GITHUB_TOKEN: ${{ steps.app-token.outputs.token }}

            - name: Auto-merge version PR
              if: steps.changesets.outputs.pullRequestNumber != ''
              env:
                  GH_TOKEN: ${{ steps.app-token.outputs.token }}
                  PR_NUMBER: ${{ steps.changesets.outputs.pullRequestNumber }}
              run: gh pr merge "$PR_NUMBER" --auto --squash

            - name: Title release like previous ones
              if: steps.changesets.outputs.published == 'true'
              env:
                  GH_TOKEN: ${{ steps.app-token.outputs.token }}
              run: |
                  VERSION="$(node -p "require('./package.json').version")"
                  gh release edit "v${VERSION}" --title "Release v${VERSION}"
